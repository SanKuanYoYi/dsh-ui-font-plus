# dsh-ui-font-plus bundle patch: inserts the plugin row into the web profile
# roster. Applied as a profile bundle layer (the `dsh.bundle.patch` manifest
# field); install it with
# `dsh plugin --profile <name> add github:<owner>/dsh-ui-font-plus`.
- insert:
    - id: ui-font-plus
      name: 'dsh-ui-font-plus'
      inject:
        - webServer
        - settings
